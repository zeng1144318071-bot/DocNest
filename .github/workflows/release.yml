name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  status:
    runs-on: windows-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Preserve an already published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0 -and $draft -eq 'false') {
            'published=true' >> $env:GITHUB_OUTPUT
            Write-Output 'This release is already published; existing assets are preserved.'
          } else {
            'published=false' >> $env:GITHUB_OUTPUT
          }
          exit 0
  release:
    needs: status
    if: needs.status.outputs.published != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches package version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match package.json' }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: python -m pip install -r requirements-test.txt
      - run: npm run test:windows
      - name: Package tested application
        run: npx --no-install electron-builder --win nsis --x64 --prepackaged release/win-unpacked --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate SHA256 checksums
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assetNames = @("ProjectVault-Setup-$version-x64.exe", "ProjectVault-Setup-$version-x64.exe.blockmap", 'latest.yml', "ProjectVault-Examples-$version.zip", 'project-vault-example.json')
          $lines = $assetNames | ForEach-Object { (Get-FileHash -LiteralPath (Join-Path 'release' $_) -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_ }
          [IO.File]::WriteAllLines((Join-Path $PWD 'release/SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
      - name: Publish installer and update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @("ProjectVault-Setup-$version-x64.exe", "ProjectVault-Setup-$version-x64.exe.blockmap", 'latest.yml', "ProjectVault-Examples-$version.zip", 'project-vault-example.json', 'SHA256SUMS.txt') | ForEach-Object { Join-Path $PWD "release/$_" }
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "项目资料库 $env:RELEASE_TAG" --generate-notes
