name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate isolated test diagnostics
        run: |
          $diagnostics = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '../vault-build-check'))
          "PV_TEST_ARTIFACTS=$diagnostics" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: python -m pip install -r requirements-test.txt
      - run: npm run test:windows
      - name: Package installer for verification
        run: npx --no-install electron-builder --win nsis --x64 --prepackaged release/win-unpacked --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify default directory and uninstall
        run: ./scripts/smoke_installer_windows.ps1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-diagnostics
          path: ${{ env.PV_TEST_ARTIFACTS }}
          retention-days: 7
